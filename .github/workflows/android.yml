name: StudyLock exact Android build

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STUDYLOCK_FIREBASE_API_KEY: ${{ secrets.STUDYLOCK_FIREBASE_API_KEY }}
      STUDYLOCK_FIREBASE_PROJECT_ID: studylock-family
      STUDYLOCK_FIREBASE_STORAGE_BUCKET: studylock-family.firebasestorage.app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify exact HTML
        run: ./scripts/verify-html.sh
      - name: Verify WebView JavaScript
        run: |
          node --check app/src/main/assets/native-bridge.js
          node --check app/src/main/assets/studylock-enhancements.js
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace
      - name: Calculate artifact SHA-256
        run: |
          sha256sum studylock-exact.html app/src/main/assets/studylock-exact.html app/build/outputs/apk/debug/app-debug.apk > SHA256SUMS-ci.txt
      - uses: actions/upload-artifact@v4
        with:
          name: StudyLock-exact-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            studylock-exact.html
            SHA256SUMS-ci.txt
          if-no-files-found: error
